 {k:["what is mehfil","about mehfil","what can it do","what can mehfil","features","what does","എന്താണ് മെഹ്ഫിൽ","മെഹ്ഫിൽ എന്ത","സൗകര്യങ്ങൾ","എന്തൊക്കെ ചെയ്യ"],
  en:"Mehfil is a website for running arts fests and competitions in madrasas, schools and colleges. It covers everything from start to finish:\n• Team leaders register their own students; chest numbers come automatically\n• Programmes and a clash-free schedule\n• Judges enter marks on their phones\n• Ranks, grades and team points are worked out for you\n• Live leaderboard, a public results link and a big-screen view\n• Certificates with a QR check, ID cards and winner posters\n• Locks to control registration and results",
  ml:"മദ്രസ, സ്കൂൾ, കോളേജ് എന്നിവിടങ്ങളിലെ കലാമേളകളും മത്സരങ്ങളും നടത്താനുള്ള വെബ്സൈറ്റാണ് മെഹ്ഫിൽ. തുടക്കം മുതൽ അവസാനം വരെ എല്ലാം ഇതിലുണ്ട്:\n• ടീം ലീഡർമാർ സ്വന്തം കുട്ടികളെ ചേർക്കും; ചെസ്റ്റ് നമ്പർ തനിയെ വരും\n• പരിപാടികളും ക്ലാഷ് ഇല്ലാത്ത ഷെഡ്യൂളും\n• ജഡ്ജസ് ഫോണിൽ മാർക്ക് ഇടും\n• റാങ്കും ഗ്രേഡും ടീം പോയിന്റും തനിയെ കണക്കാക്കും\n• തത്സമയ പോയിന്റ് നില, പൊതു ഫല ലിങ്ക്, വലിയ സ്ക്രീൻ\n• ക്യൂആർ പരിശോധനയുള്ള സർട്ടിഫിക്കറ്റ്, ഐഡി കാർഡ്, വിജയി പോസ്റ്റർ\n• രജിസ്ട്രേഷനും ഫലവും നിയന്ത്രിക്കാൻ പൂട്ടുകൾ"},
 {k:["free","cost","price","pay","money","charge","rupee","paisa","cash","fee","subscription","plan","plans","trial","upgrade","renew","expired","coupon month","സൗജന്യ","പണം","പൈസ","ഫീസ്","രൂപ","ചാർജ്","വില","ഫ്രീ","കാശ്","പ്ലാൻ","കാലാവധി"],
  en:"Every institution can try one fest free: 299 hours (about 12 days) from creating it, up to 40 students, with registration, schedule, judging and live results.\nPaid plans unlock everything (certificates, ID cards, winner posters, the big screen, your own logo and colour, any number of students and fests):\n• 1 month ₹499\n• 3 months ₹1199\n• 6 months ₹2199\n• 1 year ₹4199\nOrganisers: ☰ → 'Plan' to pay online or add a coupon. When a trial or plan ends, the fest becomes read-only; nothing is lost, and choosing a plan opens it again.",
  ml:"ഓരോ സ്ഥാപനത്തിനും ഒരു ഫെസ്റ്റ് സൗജന്യമായി പരീക്ഷിക്കാം: ഫെസ്റ്റ് ഉണ്ടാക്കിയത് മുതൽ 299 മണിക്കൂർ (ഏകദേശം 12 ദിവസം), പരമാവധി 40 കുട്ടികൾ. രജിസ്ട്രേഷൻ, ഷെഡ്യൂൾ, ജഡ്ജിങ്, തത്സമയ ഫലം എന്നിവ ഉണ്ടാകും.\nപണമടച്ചുള്ള പ്ലാനിൽ എല്ലാം ലഭിക്കും (സർട്ടിഫിക്കറ്റ്, ഐഡി കാർഡ്, പോസ്റ്റർ, വലിയ സ്ക്രീൻ, സ്വന്തം ലോഗോയും നിറവും, എത്ര കുട്ടികളും ഫെസ്റ്റുകളും):\n• 1 മാസം ₹499\n• 3 മാസം ₹1199\n• 6 മാസം ₹2199\n• 1 വർഷം ₹4199\nഓർഗനൈസർമാർ ☰ → 'Plan' തുറന്ന് ഓൺലൈനായി പണമടയ്ക്കാം, അല്ലെങ്കിൽ കൂപ്പൺ ചേർക്കാം. കാലാവധി കഴിഞ്ഞാൽ ഫെസ്റ്റ് മാറ്റാൻ കഴിയില്ല, പക്ഷേ ഒന്നും നഷ്ടപ്പെടില്ല; പ്ലാൻ എടുത്താൽ വീണ്ടും തുറക്കും."},
 {k:["sign up","signup","create account","new account","free account","how to start","get started","how do i start","join","how to use","account","തുടങ്ങ","അക്കൗണ്ട്","സൈൻ അപ്പ്","എങ്ങനെ ഉപയോഗി"],
  en:"To start:\n1. Open the site and press 'Create a free account' (or 'Sign up free').\n2. Enter your name, institution, WhatsApp number, a username and a password.\n3. On 'My fests', type your fest's name and press 'Create fest'.\n4. In 'Fest settings', add your teams and check the categories and stages.\n5. On 'Logins', create usernames for your team leaders and judges.\n6. Share the two links from the Dashboard.",
  ml:"തുടങ്ങാൻ:\n1. സൈറ്റ് തുറന്ന് 'Create a free account' (അല്ലെങ്കിൽ 'Sign up free') അമർത്തുക.\n2. പേര്, സ്ഥാപനം, വാട്സാപ്പ് നമ്പർ, യൂസർനെയിം, പാസ്‌വേഡ് എന്നിവ നൽകുക.\n3. 'My fests' പേജിൽ ഫെസ്റ്റിന്റെ പേര് എഴുതി 'Create fest' അമർത്തുക.\n4. 'Fest settings'-ൽ ടീമുകൾ ചേർക്കുക; കാറ്റഗറിയും സ്റ്റേജും നോക്കുക.\n5. 'Logins' പേജിൽ ടീം ലീഡർമാർക്കും ജഡ്ജസിനും യൂസർനെയിം ഉണ്ടാക്കുക.\n6. ഡാഷ്ബോർഡിലെ രണ്ട് ലിങ്കുകൾ ഷെയർ ചെയ്യുക."},
 {k:["create fest","new fest","another fest","many fests","how many fests","multiple fests","second fest","ഫെസ്റ്റ് ഉണ്ടാക്ക","പുതിയ ഫെസ്റ്റ്","എത്ര ഫെസ്റ്റ്","വേറെ ഫെസ്റ്റ്"],
  en:"After logging in as an organiser, go to 'My fests', type the fest's name and press 'Create fest'. One account can run any number of fests, and each fest has its own students, logins and links.",
  ml:"ഓർഗനൈസർ ആയി ലോഗിൻ ചെയ്ത ശേഷം 'My fests' പേജിൽ ഫെസ്റ്റിന്റെ പേര് എഴുതി 'Create fest' അമർത്തുക. ഒരു അക്കൗണ്ടിൽ എത്ര ഫെസ്റ്റും നടത്താം. ഓരോ ഫെസ്റ്റിനും വേറെ കുട്ടികളും ലോഗിനുകളും ലിങ്കുകളും ഉണ്ടാകും."},
 {k:["coupon","കൂപ്പൺ"],
  en:"Coupons come from the Mehfil team and give 1, 3, 6 or 12 months of the paid plan. Two ways to use one:\n• Already have an account: ☰ → 'Plan' → 'Have a coupon?', type it and press 'Add coupon'. Your fests and data stay.\n• Or log in with it directly: choose the 'Coupon ID' tab on the login page. The months start from the first login.",
  ml:"മെഹ്ഫിൽ ടീം നൽകുന്ന കൂപ്പൺ 1, 3, 6 അല്ലെങ്കിൽ 12 മാസത്തെ പ്ലാൻ നൽകും. രണ്ട് വഴിയുണ്ട്:\n• അക്കൗണ്ട് ഉണ്ടെങ്കിൽ: ☰ → 'Plan' → 'Have a coupon?'-ൽ കൂപ്പൺ ടൈപ്പ് ചെയ്ത് 'Add coupon' അമർത്തുക. ഫെസ്റ്റും വിവരങ്ങളും അങ്ങനെ തന്നെ ഉണ്ടാകും.\n• അല്ലെങ്കിൽ ലോഗിൻ പേജിലെ 'Coupon ID' ടാബിൽ നേരിട്ട് കയറാം. ആദ്യം കയറിയ ദിവസം മുതൽ കാലാവധി തുടങ്ങും."},
 {k:["log in","login","sign in","can't enter","cannot enter","not able to login","forgot","ലോഗിൻ","കയറാൻ പറ്റ","മറന്നു","കയറാൻ കഴിയ"],
  en:"Organisers, team leaders and judges all log in on the same page with their username and password. Team leaders and judges get their login from the fest admin, usually through the fest's login link.\nForgot the password? Team leaders and judges: ask your convener, who can make a new one on the 'Logins' page. Organisers: contact the Mehfil team.",
  ml:"ഓർഗനൈസർ, ടീം ലീഡർ, ജഡ്ജ് എല്ലാവരും ഒരേ പേജിൽ യൂസർനെയിമും പാസ്‌വേഡും നൽകി ലോഗിൻ ചെയ്യുന്നു. ടീം ലീഡർമാർക്കും ജഡ്ജസിനും ലോഗിൻ നൽകുന്നത് ഫെസ്റ്റ് അഡ്മിനാണ്, സാധാരണ ഫെസ്റ്റിന്റെ ലോഗിൻ ലിങ്ക് വഴി.\nപാസ്‌വേഡ് മറന്നോ? ടീം ലീഡർമാരും ജഡ്ജസും കൺവീനറോട് ചോദിക്കുക; അവർക്ക് 'Logins' പേജിൽ പുതിയത് ഉണ്ടാക്കാം. ഓർഗനൈസർമാർ മെഹ്ഫിൽ ടീമിനെ ബന്ധപ്പെടുക."},
 {k:["change password","new password","reset password","പാസ്‌വേഡ് മാറ്റ","പാസ്വേഡ് മാറ്റ","password"],
  en:"To change your own password: open the ☰ menu → 'Change password', enter the current password and the new one twice. An admin can make a new password for a team leader or judge on the 'Logins' page.",
  ml:"സ്വന്തം പാസ്‌വേഡ് മാറ്റാൻ: ☰ മെനു → 'Change password' തുറന്ന് ഇപ്പോഴത്തെ പാസ്‌വേഡും പുതിയത് രണ്ടുതവണയും നൽകുക. ടീം ലീഡർക്കോ ജഡ്ജിനോ അഡ്മിന് 'Logins' പേജിൽ പുതിയ പാസ്‌വേഡ് ഉണ്ടാക്കാം."},
 {k:["roles","who can","what can a team leader","what can a judge","കഴിയുക","റോൾ"],
  en:"There are four kinds of users:\n• Organiser / fest admin: controls the whole fest.\n• Team leader: registers and manages only their own team's students, sees the team's points, files appeals.\n• Judge: sees only the programmes given to them and enters marks by chest number (names are hidden).\n• Public (parents and everyone): opens the results link without logging in.",
  ml:"നാല് തരം ഉപയോക്താക്കളുണ്ട്:\n• ഓർഗനൈസർ / ഫെസ്റ്റ് അഡ്മിൻ: ഫെസ്റ്റ് മുഴുവൻ നിയന്ത്രിക്കുന്നു.\n• ടീം ലീഡർ: സ്വന്തം ടീമിലെ കുട്ടികളെ മാത്രം ചേർക്കും, ടീമിന്റെ പോയിന്റ് കാണും, അപ്പീൽ നൽകും.\n• ജഡ്ജ്: തനിക്ക് നൽകിയ പരിപാടികൾ മാത്രം കാണും, ചെസ്റ്റ് നമ്പർ നോക്കി മാർക്ക് ഇടും (പേര് കാണില്ല).\n• പൊതുജനം (രക്ഷിതാക്കൾ ഉൾപ്പെടെ): ലോഗിൻ ഇല്ലാതെ ഫല ലിങ്ക് തുറക്കാം."},
 {k:["create login","add judge","add team leader","username for","logins page","give login","judge login","team leader login","ലോഗിൻ ഉണ്ടാക്ക","ജഡ്ജിനെ ചേർ","ടീം ലീഡറെ ചേർ","യൂസർനെയിം ഉണ്ടാക്ക"],
  en:"Open ☰ → 'Logins'. Choose the role (Team leader, Judge or Fest admin), enter a name, username and password (for a team leader, also choose the team) and create it. From there you can share the details on WhatsApp, make a new password, or delete a login.",
  ml:"☰ → 'Logins' തുറക്കുക. റോൾ (Team leader, Judge, Fest admin) തിരഞ്ഞെടുത്ത് പേര്, യൂസർനെയിം, പാസ്‌വേഡ് നൽകുക (ടീം ലീഡർക്ക് ടീമും തിരഞ്ഞെടുക്കണം). അവിടെനിന്ന് വിവരങ്ങൾ വാട്സാപ്പിൽ അയക്കാം, പുതിയ പാസ്‌വേഡ് ഉണ്ടാക്കാം, ലോഗിൻ നീക്കാം."},
 {k:["add team","teams","house","category","categories","stage","stages","sub-fest","fest settings","setup","set up","ടീം ചേർ","കാറ്റഗറി","സ്റ്റേജ്","സെറ്റിങ്"],
  en:"Open ☰ → 'Fest settings':\n• Teams: add each team (house or group) and tap its colour to change it.\n• Categories: Kids, Sub Junior, Junior and Senior are ready; rename or add more. Each has its own starting chest number.\n• Stages: places where programmes run at the same time.\n• Schedule: number of days, start and end time, and slot length.\n• Programme limit per student, and Points and grades.\nPress Save under each section.",
  ml:"☰ → 'Fest settings' തുറക്കുക:\n• ടീമുകൾ: ഓരോ ടീമും ചേർക്കുക; നിറം മാറ്റാൻ നിറത്തിൽ തൊടുക.\n• കാറ്റഗറി: Kids, Sub Junior, Junior, Senior തയ്യാറാണ്; പേര് മാറ്റാം, പുതിയത് ചേർക്കാം. ഓരോന്നിനും തുടങ്ങുന്ന ചെസ്റ്റ് നമ്പർ വേറെ.\n• സ്റ്റേജുകൾ: ഒരേ സമയം പരിപാടി നടക്കുന്ന സ്ഥലങ്ങൾ.\n• ഷെഡ്യൂൾ: ദിവസങ്ങൾ, തുടങ്ങുന്നതും അവസാനിക്കുന്നതുമായ സമയം, ഓരോ സ്ലോട്ടിന്റെ നീളം.\n• ഒരു കുട്ടിക്ക് എത്ര പരിപാടി, പോയിന്റും ഗ്രേഡും.\nഓരോ ഭാഗത്തിനും താഴെയുള്ള Save അമർത്തുക."},
 {k:["chest","ചെസ്റ്റ്"],
  en:"Chest numbers are given automatically when a student is registered. Each category starts from its own number (for example Kids 101, 102… and Sub Junior 201…). You can change the starting number in 'Fest settings' → Categories.",
  ml:"കുട്ടിയെ ചേർക്കുമ്പോൾ ചെസ്റ്റ് നമ്പർ തനിയെ വരും. ഓരോ കാറ്റഗറിയും സ്വന്തം നമ്പറിൽ നിന്ന് തുടങ്ങും (ഉദാഹരണം Kids 101, 102… Sub Junior 201…). തുടങ്ങുന്ന നമ്പർ 'Fest settings' → Categories-ൽ മാറ്റാം."},
 {k:["register student","add student","candidate","enter students","bulk","excel list","register","കുട്ടികളെ ചേർ","കുട്ടിയെ ചേർ","വിദ്യാർത്ഥി","രജിസ്ട്രേഷൻ","രജിസ്റ്റർ"],
  en:"Team leaders: open 'Candidates', type the student's name, choose the category (and skills if you like) and press 'Register'. The chest number comes automatically. Admins can register for any team, and can add many students at once with Bulk entry by pasting lines copied from Excel.",
  ml:"ടീം ലീഡർമാർ: 'Candidates' തുറന്ന് കുട്ടിയുടെ പേര് എഴുതി കാറ്റഗറി തിരഞ്ഞെടുത്ത് 'Register' അമർത്തുക. ചെസ്റ്റ് നമ്പർ തനിയെ വരും. അഡ്മിന് ഏത് ടീമിനും ചേർക്കാം; Excel-ൽ നിന്ന് കോപ്പി ചെയ്ത വരികൾ ഒട്ടിച്ച് ഒരുമിച്ച് (Bulk entry) ചേർക്കാനും കഴിയും."},
 {k:["choose programme","select programme","enroll","programme limit","how many programmes","പരിപാടി തിരഞ്ഞെടു","എത്ര പരിപാടി","പരിപാടിക്ക് ചേർ"],
  en:"On 'Candidates', press 'Programmes' next to a student and tick the programmes. Mehfil won't allow two programmes at the same time, and it keeps to the limit set in Fest settings (4 per student unless you change it).",
  ml:"'Candidates' പേജിൽ കുട്ടിയുടെ നേരെയുള്ള 'Programmes' അമർത്തി പരിപാടികൾ ടിക്ക് ചെയ്യുക. ഒരേ സമയത്തുള്ള രണ്ട് പരിപാടികൾ മെഹ്ഫിൽ അനുവദിക്കില്ല. Fest settings-ൽ നിശ്ചയിച്ച പരിധിയും പാലിക്കും (മാറ്റിയില്ലെങ്കിൽ ഒരാൾക്ക് 4)."},
 {k:["substitut","replace student","change student","can't take part","absent","പകരം","പങ്കെടുക്കാൻ പറ്റ"],
  en:"If a student can't take part, use the Substitution section on 'Candidates': choose the programme, the student going out and the one coming in (same team and category). It's allowed until judging starts.",
  ml:"ഒരു കുട്ടിക്ക് പങ്കെടുക്കാൻ കഴിയില്ലെങ്കിൽ 'Candidates' പേജിലെ Substitution ഭാഗം ഉപയോഗിക്കുക: പരിപാടി, പോകുന്ന കുട്ടി, പകരം വരുന്ന കുട്ടി (ഒരേ ടീമും കാറ്റഗറിയും) തിരഞ്ഞെടുക്കുക. ജഡ്ജിങ് തുടങ്ങും വരെ ഇത് ചെയ്യാം."},
 {k:["topic","വിഷയം","ടോപ്പിക്"],
  en:"For programmes like speech or essay, tick 'Needs a topic' when adding the programme. Team leaders then enter each student's topic on 'Candidates', and judges see the topic next to the chest number.",
  ml:"പ്രസംഗം, ഉപന്യാസം പോലുള്ള പരിപാടികൾ ചേർക്കുമ്പോൾ 'Needs a topic' ടിക്ക് ചെയ്യുക. ടീം ലീഡർമാർ 'Candidates' പേജിൽ ഓരോ കുട്ടിയുടെയും വിഷയം നൽകും; ജഡ്ജസ് ചെസ്റ്റ് നമ്പറിനൊപ്പം വിഷയം കാണും."},
 {k:["add programme","new programme","programmes","programme","event","item","competition item","assign judge","പരിപാടി ചേർ","ഇനം","മത്സര ഇനം","പ്രോഗ്രാം","പരിപാടി"],
  en:"Open ☰ → 'Programmes'. Enter the name, category, sub-fest and stage, tick 'Needs a topic' if needed, choose the judges and press 'Add programme'. It's placed on the schedule automatically. Use 'Edit' to change it later. A programme can have up to 7 judges.",
  ml:"☰ → 'Programmes' തുറക്കുക. പേര്, കാറ്റഗറി, സബ് ഫെസ്റ്റ്, സ്റ്റേജ് നൽകുക; വേണമെങ്കിൽ 'Needs a topic' ടിക്ക് ചെയ്യുക; ജഡ്ജസിനെ തിരഞ്ഞെടുത്ത് 'Add programme' അമർത്തുക. അത് ഷെഡ്യൂളിൽ തനിയെ വരും. പിന്നീട് മാറ്റാൻ 'Edit' ഉപയോഗിക്കാം. ഒരു പരിപാടിക്ക് 7 ജഡ്ജസ് വരെ ആകാം."},
 {k:["schedule","time table","timetable","clash","ഷെഡ്യൂൾ","സമയക്രമം","ക്ലാഷ്","ടൈം ടേബിൾ"],
  en:"Open ☰ → 'Schedule' and press 'Build automatically'. Mehfil places every programme so that no student has two programmes at the same time and no stage is double-booked. You can change any time by hand; clashes show in red, and 'Fix automatically' sorts them out. The public site shows the schedule too.",
  ml:"☰ → 'Schedule' തുറന്ന് 'Build automatically' അമർത്തുക. ഒരു കുട്ടിക്കും ഒരേ സമയം രണ്ട് പരിപാടി വരാതെയും ഒരു സ്റ്റേജിൽ ഒരേ സമയം രണ്ടെണ്ണം വരാതെയും മെഹ്ഫിൽ എല്ലാം ക്രമീകരിക്കും. ഏത് സമയവും കൈകൊണ്ട് മാറ്റാം; ക്ലാഷ് ചുവപ്പിൽ കാണിക്കും, 'Fix automatically' അത് ശരിയാക്കും. പൊതു സൈറ്റിലും ഷെഡ്യൂൾ കാണാം."},
 {k:["judge mark","enter mark","give mark","marks","mark sheet","scoring","judging","മാർക്ക്","ജഡ്ജ് എങ്ങനെ","ജഡ്ജിങ്"],
  en:"Judges log in with the username the admin gave them, open 'My programmes', choose a programme, enter a mark from 0 to 100 for each chest number and press 'Submit marks'. Student names are hidden to keep judging fair. Marks can't be changed after submitting; the admin can send the programme back if needed. If the internet drops, the marks are kept and sent when the phone is back online.",
  ml:"അഡ്മിൻ നൽകിയ യൂസർനെയിമിൽ ജഡ്ജ് ലോഗിൻ ചെയ്ത് 'My programmes' തുറന്ന് പരിപാടി തിരഞ്ഞെടുക്കുക. ഓരോ ചെസ്റ്റ് നമ്പറിനും 0 മുതൽ 100 വരെ മാർക്ക് നൽകി 'Submit marks' അമർത്തുക. നീതിക്കായി കുട്ടികളുടെ പേര് ജഡ്ജസിന് കാണില്ല. സമർപ്പിച്ച ശേഷം മാറ്റാനാവില്ല; ആവശ്യമെങ്കിൽ അഡ്മിന് തിരിച്ചയക്കാം. ഇന്റർനെറ്റ് പോയാലും മാർക്ക് ഫോണിൽ സൂക്ഷിച്ച് പിന്നീട് തനിയെ അയക്കും."},
 {k:["admin mark","admin enter","admin can enter","without judge","no judge","paper mark","mark entry","enter for judge","admin result","അഡ്മിന് മാർക്ക്","അഡ്മിൻ മാർക്ക്","ജഡ്ജ് ഇല്ലാതെ","മാർക്ക് എൻട്രി","അഡ്മിന് റിസൾട്ട്"],
  en:"Yes, admins can enter marks too. Open ☰ → 'Mark entry', choose the programme and whose marks you're entering (a judge's paper sheet, or 'Admin (direct marks)' when the programme has no judges), type the marks and press 'Save these marks'. The 'Enter marks' button on Score verification takes you there as well.",
  ml:"അതെ, അഡ്മിനും മാർക്ക് ഇടാം. ☰ → 'Mark entry' തുറന്ന് പരിപാടി തിരഞ്ഞെടുക്കുക. ആരുടെ മാർക്കാണ് നൽകുന്നത് എന്ന് തിരഞ്ഞെടുക്കുക (ഒരു ജഡ്ജിന്റെ പേപ്പർ ഷീറ്റ്, അല്ലെങ്കിൽ ജഡ്ജസ് ഇല്ലാത്ത പരിപാടിക്ക് 'Admin (direct marks)'). മാർക്ക് നൽകി 'Save these marks' അമർത്തുക. Score verification പേജിലെ 'Enter marks' ബട്ടൺ വഴിയും എത്താം."},
 {k:["verify","verification","check marks","mismatch","send back","difference","പരിശോധ","വെരിഫൈ"],
  en:"When all judges have submitted, the programme appears on ☰ → 'Score verification' with each judge's marks, the average, rank and grade. A difference of more than 15 marks between judges is flagged in red. Press 'Verify scores' if all is well, or 'Send back to judges' to have them mark again.",
  ml:"എല്ലാ ജഡ്ജസും സമർപ്പിച്ചാൽ പരിപാടി ☰ → 'Score verification' പേജിൽ വരും: ഓരോ ജഡ്ജിന്റെയും മാർക്ക്, ശരാശരി, റാങ്ക്, ഗ്രേഡ്. ജഡ്ജസ് തമ്മിൽ 15-ൽ കൂടുതൽ മാർക്ക് വ്യത്യാസമുണ്ടെങ്കിൽ ചുവപ്പിൽ കാണിക്കും. ശരിയാണെങ്കിൽ 'Verify scores', വീണ്ടും മാർക്കിടാൻ 'Send back to judges' അമർത്തുക."},
 {k:["publish","announce","declare result","release result","പ്രസിദ്ധ","ഫലം പ്രഖ്യാപ","റിസൾട്ട് ഇട","ഫലം ഇട"],
  en:"After verifying, press 'Publish result' on Score verification, or 'Publish all verified' on 'Results and points'. The leaderboard, public site, big screen and certificates update at once. A published result can be withdrawn unless the Result lock is on.",
  ml:"പരിശോധിച്ച ശേഷം Score verification-ൽ 'Publish result', അല്ലെങ്കിൽ 'Results and points' പേജിൽ 'Publish all verified' അമർത്തുക. പോയിന്റ് നില, പൊതു സൈറ്റ്, വലിയ സ്ക്രീൻ, സർട്ടിഫിക്കറ്റ് എല്ലാം ഉടനെ മാറും. Result lock ഓൺ അല്ലെങ്കിൽ പ്രസിദ്ധീകരിച്ച ഫലം പിൻവലിക്കാം."},
 {k:["point","points","grade","rank","distribution","score system","total","place","പോയിന്റ്","ഗ്രേഡ്","റാങ്ക്","സ്ഥാനം","ടോട്ടൽ","മാർക്ക് വിതരണം"],
  en:"How results are worked out:\n• Each judge gives a mark out of 100. The student's mark is the average of all judges.\n• Rank: the highest average is 1st. Equal averages share the same place.\n• Grade (usual setting): A from 80, B from 65, C from 50.\n• Points (usual setting): 1st place 5, 2nd 3, 3rd 1, plus grade A +2 and grade B +1.\n• A team's total is the sum of its points from all published results. Students' totals appear under Top individuals.\nThe admin can change all these numbers in 'Fest settings' → 'Points and grades'.",
  ml:"ഫലം കണക്കാക്കുന്ന രീതി:\n• ഓരോ ജഡ്ജും 100-ൽ മാർക്ക് നൽകും. എല്ലാ ജഡ്ജസിന്റെയും ശരാശരിയാണ് കുട്ടിയുടെ മാർക്ക്.\n• റാങ്ക്: ഏറ്റവും കൂടിയ ശരാശരി ഒന്നാം സ്ഥാനം. ശരാശരി തുല്യമായാൽ ഒരേ സ്ഥാനം.\n• ഗ്രേഡ് (സാധാരണ): 80 മുതൽ A, 65 മുതൽ B, 50 മുതൽ C.\n• പോയിന്റ് (സാധാരണ): ഒന്നാം സ്ഥാനം 5, രണ്ടാം 3, മൂന്നാം 1; കൂടാതെ A ഗ്രേഡിന് +2, B ഗ്രേഡിന് +1.\n• പ്രസിദ്ധീകരിച്ച എല്ലാ ഫലങ്ങളിലെയും പോയിന്റ് കൂട്ടിയതാണ് ടീമിന്റെ ടോട്ടൽ. കുട്ടികളുടെ ടോട്ടൽ Top individuals-ൽ കാണാം.\nഈ സംഖ്യകളെല്ലാം അഡ്മിന് 'Fest settings' → 'Points and grades'-ൽ മാറ്റാം."},
 {k:["leaderboard","big screen","projector","tv","display","standing","വലിയ സ്ക്രീൻ","പ്രൊജക്ടർ","ടിവി","പോയിന്റ് നില"],
  en:"The live leaderboard is on 'Results and points' and on the public site. For the hall, open ☰ → 'Public website' → 'Open big-screen view' on a projector or TV. It shows the leaderboard and latest results and refreshes by itself.",
  ml:"തത്സമയ പോയിന്റ് നില 'Results and points' പേജിലും പൊതു സൈറ്റിലും കാണാം. ഹാളിലേക്ക്: ☰ → 'Public website' → 'Open big-screen view' പ്രൊജക്ടറിലോ ടിവിയിലോ തുറക്കുക. പോയിന്റ് നിലയും പുതിയ ഫലങ്ങളും കാണിക്കും, തനിയെ പുതുക്കും."},
 {k:["public","parents","share link","results link","link","qr","whatsapp","രക്ഷിതാ","ലിങ്ക്","ഷെയർ","ക്യൂആർ","വാട്സാപ്പ്"],
  en:"Each fest has two links on the Dashboard (and on 'Public website'):\n1. Team leaders and judges: opens their login page.\n2. Everyone: the public results site, no login needed. Parents can see results, the leaderboard, the schedule, news, and check certificates.\nUse Copy or WhatsApp to share, or print the QR code for the notice board.",
  ml:"ഓരോ ഫെസ്റ്റിനും ഡാഷ്ബോർഡിൽ (കൂടാതെ 'Public website' പേജിൽ) രണ്ട് ലിങ്കുണ്ട്:\n1. ടീം ലീഡർമാർക്കും ജഡ്ജസിനും: അവരുടെ ലോഗിൻ പേജ്.\n2. എല്ലാവർക്കും: ലോഗിൻ വേണ്ടാത്ത പൊതു ഫല സൈറ്റ്. രക്ഷിതാക്കൾക്ക് ഫലം, പോയിന്റ് നില, ഷെഡ്യൂൾ, വാർത്ത എന്നിവ കാണാം, സർട്ടിഫിക്കറ്റ് പരിശോധിക്കാം.\nCopy അല്ലെങ്കിൽ WhatsApp ബട്ടൺ വഴി ഷെയർ ചെയ്യാം; നോട്ടീസ് ബോർഡിനായി ക്യൂആർ പ്രിന്റ് ചെയ്യാം."},
 {k:["hide result","hidden","secret","access code","close site","closing ceremony","suspense","മറയ്ക്ക","രഹസ്യ","ആക്സസ് കോഡ്","സമാപന"],
  en:"Open ☰ → 'Locks' → 'Public site' and choose: Everyone, Hide results only (until the closing ceremony; the site shows 'Results coming soon'), Access code required, or Closed to everyone.",
  ml:"☰ → 'Locks' → 'Public site'-ൽ തിരഞ്ഞെടുക്കുക: Everyone (എല്ലാവർക്കും), Hide results only (സമാപനം വരെ ഫലം മറയ്ക്കും; 'Results coming soon' എന്ന് കാണിക്കും), Access code required (കോഡ് ഉള്ളവർക്ക് മാത്രം), Closed to everyone (പൂർണമായി അടയ്ക്കും)."},
 {k:["registration lock","close registration","last date","deadline","closing date","stop registration","രജിസ്ട്രേഷൻ പൂട്ട","അവസാന തീയതി","രജിസ്ട്രേഷൻ അവസാനിപ്പി"],
  en:"On ☰ → 'Locks', turn on the Registration lock to stop team leaders from adding or changing students and programmes. You can also set a closing date; registration closes automatically after that day. Admins can still make changes.",
  ml:"☰ → 'Locks'-ൽ Registration lock ഓൺ ചെയ്താൽ ടീം ലീഡർമാർക്ക് കുട്ടികളെയോ പരിപാടികളെയോ ചേർക്കാനോ മാറ്റാനോ കഴിയില്ല. അവസാന തീയതിയും നൽകാം; ആ ദിവസം കഴിഞ്ഞാൽ തനിയെ അടയും. അഡ്മിന് അപ്പോഴും മാറ്റങ്ങൾ വരുത്താം."},
 {k:["team leader lock","block team leader","stop team leader","team leader can't login","ടീം ലീഡർ ലോഗിൻ പൂട്ട","ടീം ലീഡറെ തടയ"],
  en:"On ☰ → 'Locks', turn on 'Team leader login'. Team leaders can't log in and anyone already logged in is signed out. Judges and admins aren't affected.",
  ml:"☰ → 'Locks'-ൽ 'Team leader login' ഓൺ ചെയ്യുക. ടീം ലീഡർമാർക്ക് ലോഗിൻ ചെയ്യാൻ കഴിയില്ല; ഇതിനകം കയറിയവരും പുറത്താകും. ജഡ്ജസിനെയും അഡ്മിനെയും ഇത് ബാധിക്കില്ല."},
 {k:["appeal","complaint","objection","wrong result","result lock","അപ്പീൽ","പരാതി","തെറ്റായ ഫലം"],
  en:"After a result is published, team leaders file an appeal with a reason on 'Appeals'. The admin sees it on 'Appeals' and accepts or rejects it. If accepted, the result goes back for review and the leaderboard corrects itself. With the Result lock on, published results change only through an accepted appeal.",
  ml:"ഫലം പ്രസിദ്ധീകരിച്ച ശേഷം ടീം ലീഡർമാർക്ക് 'Appeals' പേജിൽ കാരണം സഹിതം അപ്പീൽ നൽകാം. അഡ്മിൻ അത് 'Appeals'-ൽ കണ്ട് സ്വീകരിക്കുകയോ തള്ളുകയോ ചെയ്യും. സ്വീകരിച്ചാൽ ഫലം വീണ്ടും പരിശോധനയ്ക്ക് പോകും, പോയിന്റ് നില തനിയെ ശരിയാകും. Result lock ഓൺ ആണെങ്കിൽ സ്വീകരിച്ച അപ്പീൽ വഴി മാത്രമേ ഫലം മാറൂ."},
 {k:["lock fest","fest lock","after fest","read only","ഫെസ്റ്റ് പൂട്ട","ഫെസ്റ്റ് മുഴുവൻ പൂട്ട"],
  en:"After the fest, open ☰ → 'Locks' → 'Lock fest'. Everything becomes read-only; people can still view results and print certificates. You can unlock it there later.",
  ml:"ഫെസ്റ്റ് കഴിഞ്ഞാൽ ☰ → 'Locks' → 'Lock fest' അമർത്തുക. ഒന്നും മാറ്റാൻ കഴിയില്ല; എന്നാൽ ഫലം കാണാനും സർട്ടിഫിക്കറ്റ് പ്രിന്റ് ചെയ്യാനും കഴിയും. പിന്നീട് അവിടെ നിന്ന് തുറക്കാം."},
 {k:["certificate","print","pdf","merit","participation","സർട്ടിഫിക്കറ്റ്","പ്രിന്റ്"],
  en:"Certificates are ready as soon as a result is published. Open ☰ → 'Certificates and cards', choose the programme and who (winners or everyone), pick a design (Classic, Band or Minimal) and press Print. Choose 'Save as PDF' in the print window to keep a copy. Each certificate has a code and a QR mark for checking.",
  ml:"ഫലം പ്രസിദ്ധീകരിച്ച ഉടനെ സർട്ടിഫിക്കറ്റ് തയ്യാർ. ☰ → 'Certificates and cards' തുറന്ന് പരിപാടിയും ആർക്കെന്നും (വിജയികൾ അല്ലെങ്കിൽ എല്ലാവരും) തിരഞ്ഞെടുക്കുക, ഡിസൈൻ (Classic, Band, Minimal) തിരഞ്ഞെടുത്ത് Print അമർത്തുക. പ്രിന്റ് വിൻഡോയിൽ 'Save as PDF' തിരഞ്ഞെടുത്താൽ കോപ്പി സൂക്ഷിക്കാം. ഓരോ സർട്ടിഫിക്കറ്റിലും പരിശോധനയ്ക്ക് കോഡും ക്യൂആറും ഉണ്ട്."},
 {k:["genuine","fake","check certificate","verify certificate","qr scan","scan","ഒറിജിനൽ","വ്യാജ","സ്കാൻ"],
  en:"Scan the QR on the certificate, or open the fest's public site → 'Certificate check' and type the code printed on it (for example 214-K3XQ9). It shows whether the certificate is genuine and whose it is.",
  ml:"സർട്ടിഫിക്കറ്റിലെ ക്യൂആർ സ്കാൻ ചെയ്യുക, അല്ലെങ്കിൽ ഫെസ്റ്റിന്റെ പൊതു സൈറ്റിൽ 'Certificate check' തുറന്ന് അതിലെ കോഡ് (ഉദാ: 214-K3XQ9) നൽകുക. സർട്ടിഫിക്കറ്റ് ഒറിജിനലാണോ, ആരുടേതാണ് എന്ന് കാണിക്കും."},
 {k:["id card","identity card","badge","ഐഡി കാർഡ്","ഐഡി"],
  en:"Open ☰ → 'Certificates and cards' → 'ID cards'. Choose all teams or one team and press Print. Each card shows the chest number, name, category and the student's programmes with times.",
  ml:"☰ → 'Certificates and cards' → 'ID cards' തുറക്കുക. എല്ലാ ടീമുകളോ ഒരു ടീമോ തിരഞ്ഞെടുത്ത് Print അമർത്തുക. ഓരോ കാർഡിലും ചെസ്റ്റ് നമ്പർ, പേര്, കാറ്റഗറി, കുട്ടിയുടെ പരിപാടികളും സമയവും ഉണ്ടാകും."},
 {k:["poster","congratulation","winner poster","share winner","പോസ്റ്റർ","വിജയി"],
  en:"Open ☰ → 'Certificates and cards' → 'Posters', choose a winner and a design, then press 'Download image' or 'Share' to send it straight to WhatsApp or Instagram.",
  ml:"☰ → 'Certificates and cards' → 'Posters' തുറന്ന് വിജയിയെയും ഡിസൈനും തിരഞ്ഞെടുക്കുക. 'Download image' അമർത്തി സൂക്ഷിക്കാം, 'Share' വഴി വാട്സാപ്പിലേക്കോ ഇൻസ്റ്റഗ്രാമിലേക്കോ നേരിട്ട് അയക്കാം."},
 {k:["news","notification","announcement","gallery","photo","notice","bell","വാർത്ത","അറിയിപ്പ്","ഫോട്ടോ","ഗാലറി","നോട്ടിഫിക്കേഷൻ"],
  en:"Open ☰ → 'News and media' to post news, send notifications (to everyone, team leaders, judges or one team), add photos to the gallery, and add links or downloads. These also appear on the public site. Notifications show under the bell icon at the top.",
  ml:"☰ → 'News and media' തുറന്ന് വാർത്ത ഇടാം, അറിയിപ്പ് അയക്കാം (എല്ലാവർക്കും, ടീം ലീഡർമാർക്ക്, ജഡ്ജസിന്, ഒരു ടീമിന്), ഗാലറിയിൽ ഫോട്ടോ ചേർക്കാം, ലിങ്കുകളും ഡൗൺലോഡുകളും ചേർക്കാം. ഇവ പൊതു സൈറ്റിലും വരും. അറിയിപ്പുകൾ മുകളിലെ ബെൽ ഐക്കണിൽ കാണാം."},
 {k:["export","excel","download data","google sheets","csv","backup","എക്സൽ","ഡൗൺലോഡ്"],
  en:"Open ☰ → 'Export'. Candidates, results and the schedule can be copied or downloaded for Excel or Google Sheets in one click.",
  ml:"☰ → 'Export' തുറക്കുക. കുട്ടികളുടെ ലിസ്റ്റ്, ഫലങ്ങൾ, ഷെഡ്യൂൾ എന്നിവ ഒറ്റ ക്ലിക്കിൽ Excel-ലേക്കോ Google Sheets-ലേക്കോ കോപ്പി ചെയ്യാം, ഡൗൺലോഡ് ചെയ്യാം."},
 {k:["logo","colour","color","theme","brand","red","green","ലോഗോ","കളർ","നിറം","തീം"],
  en:"Open ☰ → 'Fest settings' → 'Logo and colour'. Upload your fest's logo and choose a colour (any colour works). Press 'Save logo and colour'. Your pages, the public website, the big screen, the login link, certificates and ID cards all follow it.",
  ml:"☰ → 'Fest settings' → 'Logo and colour' തുറക്കുക. ഫെസ്റ്റിന്റെ ലോഗോ അപ്‌ലോഡ് ചെയ്ത് ഒരു നിറം തിരഞ്ഞെടുക്കുക (ഏത് നിറവും ആകാം). 'Save logo and colour' അമർത്തുക. നിങ്ങളുടെ പേജുകൾ, പൊതു സൈറ്റ്, വലിയ സ്ക്രീൻ, ലോഗിൻ ലിങ്ക്, സർട്ടിഫിക്കറ്റ്, ഐഡി കാർഡ് എല്ലാം ആ നിറത്തിലും ലോഗോയിലും ആകും."},
 {k:["offline","internet","network","no signal","saved","sync","not saving","ഇന്റർനെറ്റ്","നെറ്റ്","സേവ്"],
  en:"If the internet drops, your work is kept on your phone and sent automatically when you're back online. The pill at the top shows 'Saved', 'Saving…' or 'Offline · will retry'. Wait for 'Saved' before closing.",
  ml:"ഇന്റർനെറ്റ് പോയാലും നിങ്ങൾ ചെയ്തത് ഫോണിൽ സൂക്ഷിക്കും; നെറ്റ് തിരിച്ചുവരുമ്പോൾ തനിയെ അയക്കും. മുകളിലെ ചെറിയ ബട്ടണിൽ 'Saved', 'Saving…' അല്ലെങ്കിൽ 'Offline · will retry' എന്ന് കാണിക്കും. അടയ്ക്കും മുമ്പ് 'Saved' ആകും വരെ കാത്തിരിക്കുക."},
 {k:["phone","mobile","computer","laptop","download app","install","play store","app","ഫോൺ","മൊബൈൽ","ആപ്പ്","കമ്പ്യൂട്ടർ","ഇൻസ്റ്റാൾ"],
  en:"Mehfil is a website, so there's nothing to download. It works in any browser on phones, tablets and computers. You can add it to your phone's home screen from the browser menu if you like.",
  ml:"മെഹ്ഫിൽ ഒരു വെബ്സൈറ്റാണ്; ഒന്നും ഡൗൺലോഡ് ചെയ്യേണ്ട. ഫോൺ, ടാബ്‌ലെറ്റ്, കമ്പ്യൂട്ടർ എന്നിവയിലെ ഏത് ബ്രൗസറിലും പ്രവർത്തിക്കും. വേണമെങ്കിൽ ബ്രൗസർ മെനുവിൽ നിന്ന് ഫോണിന്റെ ഹോം സ്ക്രീനിലേക്ക് ചേർക്കാം."},
 {k:["safe","security","privacy","data","stored","secure","hack","സുരക്ഷ","ഡാറ്റ","സ്വകാര്യ"],
  en:"Each fest's data is kept separately, and only people with a login for that fest can change it. Team leaders see only their own team, and judges see chest numbers, not names. Passwords are stored in scrambled form. The public site shows only what you allow on the Locks page.",
  ml:"ഓരോ ഫെസ്റ്റിന്റെയും വിവരങ്ങൾ വേറെവേറെയാണ് സൂക്ഷിക്കുന്നത്; ആ ഫെസ്റ്റിൽ ലോഗിൻ ഉള്ളവർക്ക് മാത്രമേ മാറ്റാൻ കഴിയൂ. ടീം ലീഡർമാർ സ്വന്തം ടീം മാത്രം കാണും; ജഡ്ജസ് ചെസ്റ്റ് നമ്പർ മാത്രം കാണും, പേര് കാണില്ല. പാസ്‌വേഡുകൾ രഹസ്യ രൂപത്തിലാണ് സൂക്ഷിക്കുന്നത്. Locks പേജിൽ അനുവദിക്കുന്നത് മാത്രമേ പൊതു സൈറ്റിൽ കാണൂ."},
 {k:["delete","remove","മായ്ക്ക","ഡിലീറ്റ്","നീക്ക"],
  en:"To delete a fest: 'My fests' → Delete, then type its name to confirm. To remove a student: on 'Candidates' (allowed until their programmes are marked). To remove a programme: 'Programmes' → Edit (only before marking starts). Logins can be deleted on 'Logins'.",
  ml:"ഫെസ്റ്റ് നീക്കാൻ: 'My fests' → Delete, എന്നിട്ട് ഉറപ്പിക്കാൻ അതിന്റെ പേര് ടൈപ്പ് ചെയ്യുക. കുട്ടിയെ നീക്കാൻ: 'Candidates'-ൽ (പരിപാടിക്ക് മാർക്ക് ഇടും വരെ). പരിപാടി നീക്കാൻ: 'Programmes' → Edit (മാർക്കിടൽ തുടങ്ങും മുമ്പ്). ലോഗിനുകൾ 'Logins' പേജിൽ നീക്കാം."},
 {k:["demo","try it","test it","sample","ഡെമോ"],
  en:"Press 'See the live demo' on the home page. It opens a full sample fest you can try as an admin, a team leader or a judge. Nothing you do in the demo is saved.",
  ml:"ഹോം പേജിലെ 'See the live demo' അമർത്തുക. അഡ്മിനായോ ടീം ലീഡറായോ ജഡ്ജായോ ഉപയോഗിച്ചുനോക്കാവുന്ന ഒരു മാതൃകാ ഫെസ്റ്റ് തുറക്കും. ഡെമോയിൽ ചെയ്യുന്നതൊന്നും സേവ് ആകില്ല."},
 {k:["language","malayalam","english","arabic","urdu","ഭാഷ","മലയാളം"],
  en:"The site itself is in English. You can ask me in Malayalam or English and I'll reply in the same language. Names, programme names and news can be typed in any language.",
  ml:"സൈറ്റ് ഇംഗ്ലീഷിലാണ്. എന്നോട് മലയാളത്തിലോ ഇംഗ്ലീഷിലോ ചോദിക്കാം, അതേ ഭാഷയിൽ മറുപടി തരാം. പേരുകൾ, പരിപാടിയുടെ പേര്, വാർത്ത എന്നിവ ഏത് ഭാഷയിലും ടൈപ്പ് ചെയ്യാം."},
 {k:["contact","contact us","support","help me","customer care","call","phone number","email","instagram","ഇൻസ്റ്റഗ്രാം","ബന്ധപ്പെ","സഹായം","സപ്പോർട്ട്","നമ്പർ"],
  en:"To reach the Mehfil team, press 'Contact us' at the bottom of the home page (or in the home page ☰ menu). It opens Mehfil's Instagram page, mehfil.fest, where you can send a message.\nTeam leaders and judges can also ask their fest convener.",
  ml:"മെഹ്ഫിൽ ടീമിനെ ബന്ധപ്പെടാൻ ഹോം പേജിന്റെ താഴെയുള്ള (അല്ലെങ്കിൽ ഹോം പേജിലെ ☰ മെനുവിലുള്ള) 'Contact us' അമർത്തുക. മെഹ്ഫിലിന്റെ ഇൻസ്റ്റഗ്രാം പേജ് (mehfil.fest) തുറക്കും, അവിടെ സന്ദേശം അയക്കാം.\nടീം ലീഡർമാർക്കും ജഡ്ജസിനും ഫെസ്റ്റ് കൺവീനറോടും ചോദിക്കാം."},
 {k:["who made","who built","who created","developer","owner","creator","company","made by","ആര് ഉണ്ടാക്കി","ആരാണ് ഉണ്ടാക്കിയ","ഉടമ","ആരുടേതാണ്"],
  en:"Mehfil is built and run by the Mehfil team.",
  ml:"മെഹ്ഫിൽ ടീമാണ് മെഹ്ഫിൽ നിർമിച്ചതും നടത്തുന്നതും."},
 {k:["group","team event","duff","oppana","group item","ഗ്രൂപ്പ്","ദഫ്","ഒപ്പന"],
  en:"For group items (like Duff), register the group as one candidate, for example 'Duff Team A', in the right category, and add it to the programme. Judges then mark the group by its chest number.",
  ml:"ഗ്രൂപ്പ് ഇനങ്ങൾക്ക് (ദഫ് പോലുള്ളവ) ഗ്രൂപ്പിനെ ഒരു കാൻഡിഡേറ്റായി ചേർക്കുക, ഉദാഹരണം 'Duff Team A', ശരിയായ കാറ്റഗറിയിൽ. എന്നിട്ട് അതിനെ പരിപാടിയിൽ ചേർക്കുക. ജഡ്ജസ് ആ ചെസ്റ്റ് നമ്പറിന് മാർക്ക് ഇടും."},
 {k:["maximum","how many students","how many teams","how many judges","capacity","any limit","പരമാവധി","എത്ര കുട്ടി","എത്ര ടീം","എത്ര ജഡ്ജ്"],
  en:"There's no fixed limit on teams, students or programmes. A programme can have up to 7 judges, a fest can run up to 7 days, and you choose how many programmes each student may take (1 to 20).",
  ml:"ടീമുകൾക്കും കുട്ടികൾക്കും പരിപാടികൾക്കും നിശ്ചിത പരിധിയില്ല. ഒരു പരിപാടിക്ക് 7 ജഡ്ജസ് വരെ, ഫെസ്റ്റ് 7 ദിവസം വരെ. ഒരു കുട്ടിക്ക് എത്ര പരിപാടി എന്നത് നിങ്ങൾ തീരുമാനിക്കാം (1 മുതൽ 20 വരെ)."},
 {k:["who are you","your name","festiq","what are you","നിന്റെ പേര്","നീ ആരാ","നിങ്ങൾ ആരാ"],
  en:"I'm FESTIQ, Mehfil's assistant. Ask me anything about using Mehfil: setting up a fest, registration, judging, results, certificates or locks.",
  ml:"ഞാൻ FESTIQ, മെഹ്ഫിലിന്റെ സഹായി. മെഹ്ഫിൽ ഉപയോഗിക്കുന്നതിനെക്കുറിച്ച് എന്തും ചോദിക്കാം: ഫെസ്റ്റ് ഒരുക്കൽ, രജിസ്ട്രേഷൻ, ജഡ്ജിങ്, ഫലം, സർട്ടിഫിക്കറ്റ്, പൂട്ടുകൾ."}
];
const FQ={open:false,msgs:[],busy:false,ai:null,cid:""};
const fqMl=s=>/[ഀ-ൿ]/.test(s);
function fqLocal(q){const n=" "+String(q).toLowerCase().replace(/[?!.,;:()"'’`]/g," ").replace(/\s+/g," ")+" ";const ml=fqMl(q);
  if(/^\s*(hi|hello|hey|hai|helo|salam|assalam|as-salam|good (morning|evening|afternoon))\b/.test(n)||/(ഹലോ|ഹായ്|സലാം|അസ്സലാമു)/.test(n))return ml?"നമസ്കാരം! ഞാൻ FESTIQ. മെഹ്ഫിൽ ഉപയോഗിക്കുന്നതിനെക്കുറിച്ച് എന്തും ചോദിക്കൂ.":"Hello! I'm FESTIQ. Ask me anything about using Mehfil.";
  if(/(thank|thanks|thx|nanni|jazak)/.test(n)||/(നന്ദി|താങ്ക്സ്)/.test(n))return ml?"സന്തോഷം! വേറെ എന്തെങ്കിലും അറിയണോ?":"You're welcome! Anything else?";
  let best=null,bs=0;FQKB.forEach(e=>{let sc=0;e.k.forEach(k=>{if(n.includes(k.toLowerCase()))sc+=k.length});if(sc>bs){bs=sc;best=e}});
  if(best&&bs>=3)return ml?best.ml:best.en;
  return ml?"അതിന് എന്റെ കയ്യിൽ ഉത്തരമില്ല. മറ്റൊരു രീതിയിൽ ചോദിച്ചുനോക്കൂ, അല്ലെങ്കിൽ ☰ മെനുവിലെ Help നോക്കൂ.":"I don't have an answer for that yet. Try asking another way, or open Help in the ☰ menu."}
function fqChips(){const r=ME&&ME.role;if(VIEW==="public")return ["How do I check a certificate?","How do points work?","How much does Mehfil cost?"];
  if(r==="judge")return ["How do I enter marks?","I made a mistake in marks","What if the internet drops?"];
  if(r==="team")return ["How do I register students?","How do I choose programmes?","How do I file an appeal?"];
  if(r)return ["How do points work?","Can the admin enter marks?","How do I add my fest logo?","How do I hide results?"];
  return ["How much does Mehfil cost?","How do I start?","What can Mehfil do?","എങ്ങനെ തുടങ്ങാം?"]}
const fqFmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function fqRender(){const box=document.getElementById("fqMsgs");if(!box)return;
  box.innerHTML=FQ.msgs.map(m=>`<div class="fq-m ${m.r}">${fqFmt(m.t)}</div>`).join("")+(FQ.busy?`<div class="fq-m a"><span class="fq-typing" aria-label="FESTIQ is typing"><i></i><i></i><i></i></span></div>`:"");
  box.scrollTop=box.scrollHeight;const ch=document.getElementById("fqChips");if(ch)ch.innerHTML=fqChips().map(c=>`<button type="button">${esc(c)}</button>`).join("");
  if(ch)[...ch.children].forEach(b=>b.onclick=()=>fqAsk(b.textContent))}
async function fqAsk(q){q=String(q||"").trim().slice(0,500);if(!q||FQ.busy)return;FQ.msgs.push({r:"u",t:q});FQ.busy=true;fqRender();
  let ans="";if(HAS_API&&FQ.ai!==false){try{const hist=FQ.msgs.slice(-9,-1).map(m=>({r:m.r,t:m.t.slice(0,600)}));
      const r=await Promise.race([api("ask",{q,h:hist,ctx:{view:VIEW,role:ME?ME.role:"visitor",page:PAGE||""},cid:FQ.cid}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("slow")),15000))]);
      if(r&&r.a){ans=r.a;FQ.ai=true}else if(r&&r.offline&&!r.busy)FQ.ai=false}catch(e){}}
  if(!ans){await new Promise(r=>setTimeout(r,350));ans=fqLocal(q)}
  FQ.busy=false;FQ.msgs.push({r:"a",t:ans});fqRender()}
function fqToggle(open){FQ.open=open==null?!FQ.open:open;const p=document.getElementById("fqPanel"),f=document.getElementById("fqFab");if(!p)return;p.hidden=!FQ.open;f.classList.toggle("open",FQ.open);f.setAttribute("aria-expanded",String(FQ.open));
  if(FQ.open){if(!FQ.msgs.length)FQ.msgs.push({r:"a",t:"Hi! I'm FESTIQ, Mehfil's assistant. Ask me anything about running your fest, in English or Malayalam."});fqRender();setTimeout(()=>{const i=document.getElementById("fqIn");if(i)i.focus()},60)}}
function mountFQ(){if(document.getElementById("fqFab"))return;try{FQ.cid=localStorage.getItem("fq_cid")||"";if(!FQ.cid){FQ.cid=rid(12);localStorage.setItem("fq_cid",FQ.cid)}}catch(e){FQ.cid=rid(12)}
  document.body.insertAdjacentHTML("beforeend",`<button type="button" class="fq-fab" id="fqFab" aria-label="Ask FESTIQ, Mehfil's assistant" aria-controls="fqPanel" aria-expanded="false">${mark(32)}<span class="fq-dot" aria-hidden="true"></span></button>
  <section class="fq-panel" id="fqPanel" role="dialog" aria-label="FESTIQ assistant" hidden>
   <div class="fq-head"><span class="fq-av">${mark(24)}</span><div><b>FESTIQ</b><small>Mehfil assistant · online</small></div><button type="button" class="fq-x" id="fqX" aria-label="Close">✕</button></div>
   <div class="fq-msgs" id="fqMsgs" aria-live="polite"></div><div class="fq-chips" id="fqChips"></div>
   <form class="fq-form" id="fqForm"><label for="fqIn" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label><input id="fqIn" autocomplete="off" maxlength="500" placeholder="Ask FESTIQ anything…"><button type="submit">Send</button></form>
  </section>`);
  document.getElementById("fqFab").onclick=()=>fqToggle();document.getElementById("fqX").onclick=()=>fqToggle(false);
  document.getElementById("fqForm").onsubmit=e=>{e.preventDefault();const i=document.getElementById("fqIn");const v=i.value;i.value="";fqAsk(v)};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&FQ.open)fqToggle(false)})}
mountFQ();

</script>
</body>
