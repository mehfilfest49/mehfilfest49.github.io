function saveSite(){const sec={};Object.keys(D.site.sec).forEach(k=>sec[k]=document.getElementById("ws_"+k).checked?1:0);
  if(act("site",{title:document.getElementById("ws_t").value,tag:document.getElementById("ws_g").value,color:UI.wsc??D.site.color,sec})){UI.wsc=null;toast("Website saved")}}
function copyText(t,id){navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>{const el=document.getElementById(id);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it now.")})}

/* ---- locks ---- */
PG.locks=()=>{const L=D.locks,rc=regClosed();
  const sw=(on,fn,label)=>`<label class="swl"><span class="sw"><input type="checkbox" ${on?"checked":""} onchange="${fn}" aria-label="${label}"><span></span></span>${on?"On":"Off"}</label>`;
  const card=(on,icon,title,desc,ctrl)=>`<div class="panel lk ${on?"on":""}"><span class="lki">${ic(icon,22)}</span><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${title}</h3>${on?'<span class="pill bad">Locked</span>':'<span class="pill ok">Open</span>'}</div><p class="hint" style="margin:6px 0 14px">${desc}</p>${ctrl}</div></div>`;
  return `${head("Locks","Control who can change what, and who can see what.")}
  ${card(rc,rc?"lock":"unlock","Registration lock","When on, team leaders can't register students, change programmes, substitute or edit topics. Admins still can.",
    sw(L.reg,"act('lock',{k:'reg',v:this.checked})","Registration lock")+`<div class="row" style="margin-top:14px"><label class="f" style="max-width:280px">Closing date (locks automatically after this day)<input type="date" value="${L.regDate}" onchange="act('regDate',{d:this.value})&&toast(this.value?'Closing date set':'Closing date removed')"></label>${L.regDate?`<button class="btn ghost sm" onclick="act('regDate',{d:''})">Remove date</button>`:""}</div>${L.regDate&&!L.reg?`<p class="hint" style="margin:8px 0 0">${rc?"The date has passed, so registration is closed.":"Registration closes automatically after this date."}</p>`:""}`)}
  ${card(L.teams,L.teams?"lock":"unlock","Team leader login","When on, team leaders can't log in and anyone already logged in is signed out. Judges and admins are not affected.",sw(L.teams,"act('teamLock',{v:this.checked})","Team leader login"))}
  ${card(L.results,L.results?"lock":"unlock","Result lock","When on, nobody can withdraw or change a published result. Changes only happen through a team's appeal.",sw(L.results,"act('lock',{k:'results',v:this.checked})","Result lock"))}
  ${card(L.pub!=="open",L.pub!=="open"?"lock":"unlock","Public site","Decide who can open the results link. Hide only the results until the closing ceremony, ask for a code, or close it completely.",
    `<div class="chips">${[["open","Everyone"],["results","Hide results only"],["code","Access code required"],["closed","Closed to everyone"]].map(([k,l])=>`<button class="chip" aria-pressed="${L.pub===k}" onclick="setPub('${k}')">${l}</button>`).join("")}</div>
     <div class="row" style="margin-top:14px"><label class="f" style="max-width:260px">Access code${PUBCODE?" (saved)":""}<input id="pcode" value="${esc(PUBCODE)}" placeholder="At least 4 letters or numbers" autocomplete="off" maxlength="20"></label><button class="btn ghost" onclick="saveCode()">Save code</button></div>`)}
  ${card(L.fest,L.fest?"lock":"unlock","Lock the whole fest","After the fest, lock everything. Nobody can change anything; people can still view results and print certificates. You can unlock it here later.",
    L.fest?`<button class="btn ghost" onclick="act('lock',{k:'fest',v:false})&&toast('Fest unlocked')">${ic("unlock")} Unlock fest</button>`
    :UI.cfmFest?`<div class="cfm"><b>Are you sure?</b> Once locked, team leaders and judges can't change anything.<div class="row" style="margin-top:12px"><button class="btn bad" onclick="UI.cfmFest=false;act('lock',{k:'fest',v:true})&&toast('Fest locked')">${ic("lock")} Yes, lock it</button><button class="btn ghost" onclick="UI.cfmFest=false;paint()">Cancel</button></div></div>`
    :`<button class="btn bad" onclick="UI.cfmFest=true;paint()">${ic("lock")} Lock fest</button>`)}`};
async function saveCode(quiet){const v=(document.getElementById("pcode").value||"").trim();if(!/^[A-Za-z0-9]{4,20}$/.test(v)){toast("Use 4 to 20 letters or numbers, no spaces");return false}
  if(DEMO){PUBCODE=v;if(!quiet)toast("Access code saved");return true}
  try{await api("setCode",{fest:FID,code:v});PUBCODE=v;delete DIRTY.pcode;if(!quiet){toast("Access code saved");paint()}return true}catch(e){toast(e.message);return false}}
async function setPub(k){if(k==="code"){const v=(document.getElementById("pcode").value||"").trim();if(v!==PUBCODE||!PUBCODE){if(!await saveCode(true))return}}
  if(act("pub",{mode:k}))toast("Public site: "+PUBNAME[k])}

/* ---- logins ---- */
function genPass(){const a="abcdefghjkmnpqrstuvwxyz23456789";const r=crypto.getRandomValues(new Uint8Array(8));return [...r].map(x=>a[x%a.length]).join("")}
PG.users=()=>{const sh=UI.shareCred;const roleOpt=[["team","Team leader"],["judge","Judge"],["admin","Fest admin (full access to this fest)"]];
  return `${head("Logins","Create a username and password for each judge and team leader, then send them their details.")}
  ${sh?`<div class="panel" style="border:2px solid var(--brand)"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${ic("check")} Login ready: ${esc(sh.name)}</h3><button class="btn ghost sm" onclick="UI.shareCred=null;paint()">Close</button></div>
    <p class="hint" style="margin:6px 0 12px">Copy this and send it to them (WhatsApp works well). The password isn't shown again.</p><div class="cred" id="credt">${esc(credText(sh))}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="copyText(credText(UI.shareCred),'credt')">Copy</button></div></div>`:""}
  <div class="panel"><h3>New login</h3><div class="row">
   <label class="f">Person's name<input id="nu_n" maxlength="60" placeholder="e.g. Usthad Saleem"></label>
   <label class="f">Role<select id="nu_r" onchange="document.getElementById('nu_tw').hidden=this.value!=='team'">${roleOpt.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
   <label class="f" id="nu_tw">Team<select id="nu_t">${D.cfg.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")||"<option value=''>Add teams in Fest settings first</option>"}</select></label></div>
   <div class="row" style="margin-top:12px"><label class="f">Username<input id="nu_u" maxlength="30" autocapitalize="none" spellcheck="false" placeholder="lowercase, e.g. saleem"></label>
   <label class="f">Password<input id="nu_p" maxlength="40" value="${genPass()}"></label>
   <button class="btn" id="nu_b" onclick="addUser()">Create login</button></div></div>
  <div class="panel"><div class="tbl"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Team</th><th></th></tr>${USERS.map(u=>`<tr><td>${esc(u.name)}</td><td><code class="k">${esc(u.u)}</code></td><td>${ROLE[u.role]||u.role}</td><td>${u.team?teamBadge(u.team):"—"}</td>
    <td style="white-space:nowrap">${UI.udel===u.u?`<span class="cfm" style="padding:6px 10px">Delete? <button class="btn bad sm" onclick="delUser('${u.u}')">Yes</button> <button class="btn ghost sm" onclick="UI.udel=null;paint()">No</button></span>`
     :`<button class="btn ghost sm" onclick="resetUser('${u.u}')">New password</button> <button class="btn ghost sm" onclick="UI.udel='${u.u}';paint()">${ic("trash",14)}</button>`}</td></tr>`).join("")||`<tr><td colspan="5">No logins yet</td></tr>`}</table></div>
   ${DEMO?`<p class="hint" style="margin:12px 0 0">In the demo, logins aren't really created.</p>`:""}</div>`};
PG.users.after=()=>{const r=document.getElementById("nu_r");if(r)document.getElementById("nu_tw").hidden=r.value!=="team"};
const credText=c=>`Mehfil login for ${c.fest}\n${teamLink()?"Open: "+teamLink()+"\n":""}Username: ${c.u}\nPassword: ${c.p}\nRole: ${ROLE[c.role]||c.role}${c.teamName?" ("+c.teamName+")":""}`;
async function addUser(){const g=id=>document.getElementById(id).value.trim();const name=g("nu_n"),role=g("nu_r"),team=role==="team"?g("nu_t"):"",u=g("nu_u").toLowerCase(),p=g("nu_p");
  if(!name)return toast("Enter the person's name");if(!/^[a-z0-9_.]{3,30}$/.test(u))return toast("Usernames use lowercase letters, numbers, dots and _ (3 to 30)");if(p.length<6)return toast("Passwords need at least 6 characters");if(role==="team"&&!team)return toast("Add teams in Fest settings first");
  const b=document.getElementById("nu_b");b.disabled=true;b.textContent="Creating…";
  try{if(DEMO){if(USERS.some(x=>x.u===u))throw new Error("That username is already taken.");USERS.push({u,role,name,team})}else{const r=await api("addUser",{fest:FID,u,p,role,name,team});USERS=r.users}
    UI.shareCred={u,p,role,name,fest:D.name,teamName:team?teamOf(team).name:""};DIRTY={};toast("Login created");paint();window.scrollTo({top:0,behavior:"smooth"})}
  catch(e){b.disabled=false;b.textContent="Create login";toast(e.message)}}
async function delUser(u){try{if(DEMO)USERS=USERS.filter(x=>x.u!==u);else{const r=await api("deleteUser",{u});USERS=r.users}UI.udel=null;toast("Login deleted");paint()}catch(e){toast(e.message)}}
async function resetUser(u){const x=USERS.find(y=>y.u===u);const p=genPass();try{if(!DEMO)await api("setPassword",{u,p});UI.shareCred={u,p,role:x.role,name:x.name,fest:D.name,teamName:x.team?teamOf(x.team).name:""};toast("New password created");paint();window.scrollTo({top:0,behavior:"smooth"})}catch(e){toast(e.message)}}

/* ---- export ---- */
function csv(k){const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  if(k==="cands")return ["Chest,Name,Team,Category,Skills,Programmes",...[...D.cands].sort((a,b)=>a.chest-b.chest).map(c=>[c.chest,c.name,teamOf(c.team).name,catName(D,c.cat),c.skills.join(" / "),D.progs.filter(p=>p.parts.includes(c.id)).map(p=>p.n).join(" / ")].map(q).join(","))].join("\n");
  if(k==="results"){const r=["Programme,Category,Rank,Chest,Name,Team,Average,Grade,Points"];D.progs.filter(p=>p.status==="published").forEach(p=>calc(p).forEach(x=>{const c=C(x.cid);if(c)r.push([p.n,catName(D,p.cat),x.rank,c.chest,c.name,teamOf(c.team).name,x.avg,x.grade,x.pts].map(q).join(","))}));return r.join("\n")}
  return ["Day,Time,Stage,Programme,Category,Entries",...[...D.sched].sort((a,b)=>skey(a)-skey(b)).map(s=>{const p=P(s.pid);return p?[s.day,fmtMin(s.t),stageName(D,s.stage),p.n,catName(D,p.cat),p.parts.length].map(q).join(","):""}).filter(Boolean)].join("\n")}
PG.export=()=>{const k=UI.ex||"cands";return `${head("Export","Copy or download your data for Excel or Google Sheets.")}
  <div class="panel"><div class="chips">${[["cands","Candidates"],["results","Results"],["sched","Schedule"]].map(([x,l])=>`<button class="chip" aria-pressed="${k===x}" onclick="UI.ex='${x}';paint()">${l}</button>`).join("")}</div>
   <textarea id="csv" style="margin-top:14px;min-height:200px" readonly>${esc(csv(k))}</textarea>
   <div class="row" style="margin-top:12px;align-items:center"><button class="btn" onclick="copyText(document.getElementById('csv').value,'csv')">Copy</button><button class="btn ghost" onclick="downloadCsv('${k}')">${ic("export",16)} Download CSV</button></div></div>`};
function downloadCsv(k){const b=new Blob(["﻿"+csv(k)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${D.name.replace(/[^a-z0-9]+/gi,"-")}-${k}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---- team leader home ---- */
PG.tdash=()=>{const t=ME.team,tp=teamPts(),ord=Object.entries(tp).sort((a,b)=>b[1]-a[1]);const rank=ord.findIndex(x=>x[0]===t)+1;const mine=D.cands.filter(c=>c.team===t);
  const up=D.sched.filter(s=>(P(s.pid)||{parts:[]}).parts.some(cid=>(C(cid)||{}).team===t)).sort((a,b)=>skey(a)-skey(b));
  return `${head("Team "+esc(teamOf(t).name),"Information for your team only.")}
  <div class="grid" style="margin-top:16px"><div class="stat"><b>${rank?ordn(rank):"—"}</b><span>Position</span></div><div class="stat"><b>${tp[t]||0}</b><span>Points</span></div><div class="stat"><b>${mine.length}</b><span>Candidates</span></div><div class="stat"><b>${mine.reduce((a,c)=>a+D.progs.filter(p=>p.parts.includes(c.id)).length,0)}</b><span>Entries</span></div></div>
  <div class="two" style="margin-top:16px"><div class="panel"><h3>Leaderboard</h3>${bars(tp,k=>teamOf(k).color,k=>teamOf(k).name)}</div>
  <div class="panel"><h3>Your programmes</h3>${up.map(s=>{const p=P(s.pid);return `<div class="slot"><span class="chest">${slotLabel(s)}</span><div><b>${esc(p.n)}</b> · ${esc(stageName(D,s.stage))}<br><small style="color:var(--muted)">${p.parts.map(C).filter(c=>c&&c.team===t).map(c=>c.chest+" "+esc(c.name)).join(", ")}</small></div></div>`}).join("")||`<p class="hint">Nothing scheduled yet</p>`}</div></div>`};

/* ---- judge ---- */
PG.jdash=()=>{const mine=D.progs.filter(p=>p.judges.includes(ME.u));const cur=mine.find(p=>p.id===UI.jp)||mine.find(p=>!p.subm[ME.u]&&p.status==="pending")||mine[0];
  return `${head("My programmes","Names are hidden to keep judging fair. You see chest numbers only.")}
  <div class="panel jlist">${mine.map(p=>{const s=slotOf(p.id);return `<button class="jitem${cur&&cur.id===p.id?" on":""}" onclick="UI.jp='${p.id}';paint();document.getElementById('jsheet').scrollIntoView({behavior:'smooth'})"><span><b>${esc(p.n)}</b><small>${esc(catName(D,p.cat))} · ${esc(stageName(D,p.stage))}${s?" · "+slotLabel(s):""}</small></span>${p.subm[ME.u]?'<span class="pill ok">Submitted</span>':p.status==="pending"?'<span class="pill wait">To do</span>':'<span class="pill">Closed</span>'}</button>`}).join("")||`<p class="hint" style="margin:0">No programmes assigned to you yet.</p>`}</div>
  ${cur?`<div class="panel" id="jsheet"><h3>${esc(cur.n)} · ${esc(catName(D,cur.cat))}</h3>
   ${cur.subm[ME.u]?`<div class="msg ok">You've submitted your marks. Tell the convener if anything needs changing.</div>`:cur.status!=="pending"?`<div class="msg">Judging for this programme is closed.</div>`:""}
   ${cur.parts.length?`<div class="tbl" style="margin-top:10px"><table><tr><th>Chest</th>${cur.topic?"<th>Topic</th>":""}<th class="num">Mark (out of 100)</th></tr>${cur.parts.map(cid=>{const c=C(cid);const v=(cur.marks[ME.u]||{})[cid];const off=cur.subm[ME.u]||cur.status!=="pending"||D.locks.fest;return c?`<tr><td><span class="chest">${c.chest}</span></td>${cur.topic?`<td style="white-space:normal">${esc(cur.topics[cid]||"—")}</td>`:""}<td class="num"><input type="number" inputmode="decimal" min="0" max="100" step="0.5" id="jm_${cid}" value="${v??""}" ${off?"disabled":""} style="width:100px;text-align:right" aria-label="Mark for chest ${c.chest}"></td></tr>`:""}).join("")}</table></div>`:`<p class="hint">No students are entered in this programme yet.</p>`}
   ${cur.subm[ME.u]||cur.status!=="pending"||D.locks.fest||!cur.parts.length?"":`<div class="row" style="margin-top:14px"><button class="btn lg" onclick="submitJ('${cur.id}')">Submit marks</button></div><p class="hint" style="margin:10px 0 0">Check carefully. Marks can't be changed after submitting.</p>`}</div>`:""}`};
function submitJ(pid){const p=P(pid);const marks={};for(const cid of p.parts){const el=document.getElementById("jm_"+cid);const v=el?el.value:"";if(v===""||!(+v>=0&&+v<=100)){toast(`Chest ${(C(cid)||{}).chest}: enter a mark from 0 to 100`);if(el)el.focus();return}marks[cid]=+v}
  if(act("marks",{pid,marks}))toast("Marks submitted")}

/* ---- help + account ---- */
PG.help=()=>{const r=ME.role;const T={
  admin:[["Starting a fest","Create the fest on the My fests page. Open Fest settings and add your teams. Check the categories and stages. Then create logins for your judges and team leaders on the Logins page and send them their details."],["Adding programmes","On the Programmes page, enter the name, category, stage and judges. It's placed on the schedule automatically."],["Registering students","Team leaders register their own students, or you can add them on the Candidates page. Bulk entry accepts lines copied from Excel."],["Publishing results","Once judges submit, verify the scores on the Score verification page and publish. The leaderboard and public site update by themselves."],["Certificates and cards","As soon as a result is published, certificates are ready to print on the Certificates and cards page. Choose Save as PDF in the print window to keep a copy."],["Hiding results until the announcement","Change the public site setting on the Locks page."]],
  team:[["Registering students","On the Candidates page, enter a name and category and press Register. The chest number is assigned automatically."],["Choosing programmes","Press Programmes next to a student. Two programmes at the same time can't both be chosen."],["If someone can't take part","Use the Substitution section on the Candidates page."],["If you disagree with a result","File an appeal with a reason on the Appeals page."]],
  judge:[["Entering marks","Open a programme, enter a mark from 0 to 100 for each chest number and press Submit marks."],["If you make a mistake","Marks can't be changed after submitting. Tell the convener, who can send the programme back to you."],["Working offline","If your internet drops, your marks are kept on your phone and sent as soon as you're back online. Wait until the top bar says Saved."]]}[r==="owner"||r==="org"?"admin":r]||[];
  return `${head("Help","How to do the common tasks, in short.")}<div class="panel faq" style="max-width:none;padding-block:4px">${T.map(([q,a],i)=>`<details ${i===0?"open":""}><summary>${q}</summary><p>${a}</p></details>`).join("")}</div>
  <div class="panel"><h3>Still stuck?</h3><p class="hint" style="margin:0">${ADM(ME)?"Contact the Mehfil team.":"Contact your fest convener."}</p></div>`};
PG.account=()=>`${head("Change password","Choose a new password for your own login.")}
  <div class="panel" style="max-width:520px"><label class="f">Current password<input id="pw_o" type="password" autocomplete="current-password"></label>
   <label class="f" style="margin-top:12px">New password<input id="pw_n" type="password" autocomplete="new-password"></label>
   <label class="f" style="margin-top:12px">New password again<input id="pw_n2" type="password" autocomplete="new-password"></label>
   <div class="row" style="margin-top:14px"><button class="btn" id="pw_b" onclick="changePw()">Change password</button></div></div>`;
async function changePw(){const o=document.getElementById("pw_o").value,n=document.getElementById("pw_n").value,n2=document.getElementById("pw_n2").value;
  if(n.length<6)return toast("Passwords need at least 6 characters");if(n!==n2)return toast("The new passwords don't match");
  const b=document.getElementById("pw_b");b.disabled=true;try{await api("setPassword",{u:ME.u,old:o,p:n});DIRTY={};toast("Password changed");go(menu()[0][0])}catch(e){b.disabled=false;toast(e.message)}}

/* =========================================================
   PUBLIC WEBSITE + BIG SCREEN
   ========================================================= */
function openPublicPreview(){PUBV={preview:true,tab:"results"};VIEW="public";paint();window.scrollTo({top:0})}
function pubS(){return PUBV&&PUBV.preview?D:PUBV&&PUBV.S}
async function pubLoad(){if(!PUBV||PUBV.preview)return;try{const r=await api("public",{fest:PUBV.fest,since:0,code:PUBV.code||""});PUBV.err="";
    if(r.need==="closed"){PUBV.closed=true;PUBV.need=false;PUBV.name=r.name;PUBV.S=null;paint();clearInterval(PUBV.timer);PUBV.timer=setInterval(pubLoad,60000);return}
    if(r.need){PUBV.need=true;PUBV.closed=false;PUBV.bad=r.bad;PUBV.name=r.name;PUBV.S=null;paint();return}
    PUBV.need=false;PUBV.closed=false;const S=blankFest(PUBV.fest,r.name);(r.ops||[]).forEach(o=>apply(S,o));PUBV.S=S;PUBV.seq=r.seq;PUBV.pub=r.pub;PUBV.name=r.name;paint();
    if(PUBV.v&&PUBV.tab==="verify"){setTimeout(()=>{const i=document.getElementById("vc");if(i){i.value=PUBV.v;verifyCode()}},50)}}
  catch(e){PUBV.err=e.message;paint()}
  clearInterval(PUBV.timer);PUBV.timer=setInterval(pubPoll,VIEW==="screen"?15000:20000)}
async function pubPoll(){if(!PUBV||PUBV.preview||!PUBV.S||document.hidden)return;try{const r=await api("public",{fest:PUBV.fest,since:PUBV.seq,code:PUBV.code||""});if(r.need){PUBV.S=null;pubLoad();return}
  if(r.pub!==PUBV.pub){PUBV.pub=r.pub;PUBV.S=null;pubLoad();return}let ch=false;(r.ops||[]).forEach(o=>{if(o.seq>PUBV.seq){apply(PUBV.S,o);ch=true}});PUBV.seq=Math.max(PUBV.seq,r.seq);if(ch&&!isEditing())paint()}catch(e){}}
function soonPanel(){return `<div class="panel" style="margin-top:20px;text-align:center;padding:44px 18px"><span class="lki" style="margin:0 auto">${ic("lock",22)}</span><h3 style="margin-top:14px">Results coming soon</h3><p class="hint" style="margin:0">Results will appear here after they're announced at the closing ceremony.</p></div>`}
function PUBLIC_VIEW(){const pv=PUBV||{};
  if(!pv.preview&&pv.err)return `<div class="loading">${mark(54)}<h2 style="margin-top:6px">Can't open this fest</h2><p>${esc(pv.err)}</p><button class="btn" onclick="PUBV.err='';pubLoad();paint()">Try again</button></div>`;
  if(!pv.preview&&pv.closed)return `<div class="loading">${mark(54)}<h2 style="margin-top:6px;color:var(--ink)">${esc(pv.name||"This fest")}</h2><p>This site is closed for now. Please check back later.</p></div>`;
  if(!pv.preview&&pv.need)return `<div class="pubgate gut"><div class="gate"><div class="gt" style="background:${COLORS[0]}">${ic("lock",30)}<h1>${esc(pv.name||"Mehfil")}</h1><div style="opacity:.85;font-size:14px;margin-top:4px">Enter the access code to view this site</div></div>
   <form class="gb" onsubmit="event.preventDefault();pubUnlock()"><label class="f">Access code<input id="pc" type="password" autocomplete="off"></label><div id="pcmsg">${pv.bad?`<div class="msg bad">That code isn't right. Please try again.</div>`:""}</div><button class="btn lg" type="submit">${ic("unlock")} Open</button>
   <p class="hint" style="margin:0">Don't have the code? Ask your institution's fest convener.</p></form></div></div>`;
  const S=pubS();if(!S)return `<div class="loading">${mark(54)}<div class="spin"></div><p>Loading results…</p></div>`;
  const s=S.site,col=COLORS[s.color]||COLORS[0];const hideRes=(pv.preview?S.locks.pub:pv.pub||S.locks.pub)==="results";
  const T=[["results","Results"],["board","Leaderboard"],["sched","Schedule"],["news","News"],["gallery","Gallery"],["verify","Certificate check"]].filter(([k])=>s.sec[k]);
  if(!T.some(t=>t[0]===pv.tab)&&T.length)pv.tab=T[0][0];let b="";const pubs=S.progs.filter(p=>p.status==="published").sort((a,b)=>(b.pubT||0)-(a.pubT||0));
  const tN=id=>tOf(S,id).name,tC=id=>tOf(S,id).color,tB=id=>`<span class="team"><span class="dot" style="background:${tC(id)}"></span>${esc(tN(id))}</span>`;
  if((pv.tab==="results"||pv.tab==="board"||pv.tab==="verify")&&hideRes)b=soonPanel();
  else if(pv.tab==="results")b=pubs.length?`<div class="two" style="margin-top:20px">${pubs.map(p=>`<div class="panel"><h3>${esc(p.n)} <small style="color:var(--muted);font:500 13px var(--body)">${esc(catName(S,p.cat))}</small></h3>${calcS(S,p).filter(r=>r.rank<=3).map(r=>{const c=cOf(S,r.cid);return c?`<div class="slot"><span style="font-size:22px">${["🥇","🥈","🥉"][r.rank-1]}</span><div><b>${esc(c.name)}</b> <span class="chest">${c.chest}</span><br><small>${tB(c.team)} · Grade ${r.grade}</small></div></div>`:""}).join("")}</div>`).join("")}</div>`:`<div class="panel" style="margin-top:20px">Results will appear here as soon as they're published.</div>`;
  else if(pv.tab==="board"){const tp=teamPtsS(S);b=`<div class="panel" style="margin-top:20px"><h3>Live leaderboard</h3>${S.cfg.teams.length?bars(Object.fromEntries(Object.entries(tp).sort((a,b)=>b[1]-a[1])),tC,tN):"<p class='hint'>No teams yet.</p>"}<p class="hint" style="margin-top:14px">Results in for ${pubs.length} of ${S.progs.length} programmes</p></div>`}
  else if(pv.tab==="sched"){b=[...Array(S.cfg.days)].map((_,i)=>i+1).map(d=>{const it=S.sched.filter(x=>x.day===d);if(!it.length)return "";return `${S.cfg.days>1?`<h3 style="margin:22px 0 0">Day ${d}</h3>`:""}<div class="stages" style="margin-top:16px">${S.cfg.stages.map(st=>{const a=it.filter(x=>x.stage===st.id).sort((x,y)=>x.t-y.t);if(!a.length)return "";return `<div class="panel" style="margin:0"><h3>${esc(st.name)}</h3>${a.map(x=>{const p=pOf(S,x.pid);return p?`<div class="slot"><span class="chest">${fmtMin(x.t)}</span><div><b>${esc(p.n)}</b><br><small style="color:var(--muted)">${esc(catName(S,p.cat))}</small></div></div>`:""}).join("")}</div>`}).join("")}</div>`}).join("")||`<div class="panel" style="margin-top:20px">The schedule will appear here.</div>`}
  else if(pv.tab==="news")b=`<div class="two" style="margin-top:20px"><div class="panel"><h3>News</h3><div class="news">${S.news.map(n=>`<p>${esc(n.txt)} <small style="color:var(--muted)">${fmtTs(n.t)}</small></p>`).join("")||"<p>No news yet</p>"}</div></div><div class="panel"><h3>Links and downloads</h3><div class="news">${S.links.map(l=>`<p>📄 <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.t)}</a></p>`).join("")||"<p>Nothing yet</p>"}</div></div></div>`;
  else if(pv.tab==="gallery")b=`<div class="panel" style="margin-top:20px"><div class="gal">${S.gallery.map(g=>`<figure><img src="${g.src}" alt="${esc(g.cap)}" loading="lazy"><figcaption>${esc(g.cap)}</figcaption></figure>`).join("")||"No photos yet"}</div></div>`;
  else if(pv.tab==="verify")b=`<div class="panel" style="margin-top:20px;max-width:640px"><h3>Is this certificate genuine?</h3><p class="hint">Enter the code printed on the certificate, or scan its QR code.</p><div class="row"><label class="f">Code<input id="vc" placeholder="e.g. 214-K3XQ9" autocapitalize="characters" value="${esc(pv.v||"")}"></label><button class="btn" onclick="verifyCode()">Check</button></div><div id="vres"></div></div>`;
  return `${pv.preview?`<div class="prev gut"><b>Preview</b><span>This is what the public sees</span><button class="btn sm" style="margin-left:auto" onclick="VIEW='app';PUBV=null;paint()">${ic("back")} Back</button></div>`:""}
  <div class="pub-top" style="background:${col}"><div class="in gut wrap"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div style="opacity:.85;font-size:14px">${esc(s.tag)}</div><h1>${esc(s.title)}</h1></div></div>
   <div class="pub-tabs">${T.map(([k,l])=>`<button aria-current="${k===pv.tab}" onclick="PUBV.tab='${k}';paint()">${l}</button>`).join("")}</div></div></div>
  <div class="gut wrap" style="padding-block:0 48px">${b}</div>
  <footer class="foot gut"><div class="in wrap" style="justify-content:center"><span style="display:flex;align-items:center;gap:8px">${mark(20)} Powered by Mehfil</span></div></footer>`}
function afterPub(){}
function pubUnlock(){const v=document.getElementById("pc").value.trim();if(!v)return;PUBV.code=v;try{sessionStorage.setItem("mf_code_"+PUBV.fest,v)}catch(e){}PUBV.need=false;paint();pubLoad()}
function verifyCode(){const S=pubS();const v=(document.getElementById("vc").value||"").trim().toUpperCase().replace(/\s/g,"");const m=v.match(/^(\d+)-([A-Z0-9]{1,5})$/);const out=document.getElementById("vres");
  let ok=null;if(m&&S){const c=S.cands.find(x=>x.chest===+m[1]);const p=S.progs.find(x=>x.id.slice(0,5).toUpperCase()===m[2]);if(c&&p&&p.status==="published"){const r=calcS(S,p).find(x=>x.cid===c.id);if(r)ok={c,p,r}}}
  out.innerHTML=ok?`<div class="msg ok">✓ <b>Genuine certificate.</b> ${esc(ok.c.name)} (chest ${ok.c.chest}), ${esc(ok.p.n)}: ${ok.r.rank<=3?ordn(ok.r.rank)+" place, ":""}grade ${ok.r.grade}.</div>`:`<div class="msg bad">No certificate matches this code. Check the letters and numbers and try again.</div>`}
function SCREEN_VIEW(){const pv=PUBV||{};if(pv.need||pv.closed)return PUBLIC_VIEW();const S=pv.S;if(!S)return `<div class="loading">${mark(54)}<div class="spin"></div><p>${esc(pv.err||"Loading…")}</p></div>`;
  const hide=(pv.pub||S.locks.pub)==="results";const tp=teamPtsS(S);const ord=Object.entries(tp).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...ord.map(x=>x[1]));
  const pubs=S.progs.filter(p=>p.status==="published").sort((a,b)=>(b.pubT||0)-(a.pubT||0)).slice(0,4);
  return `<div class="screen"><div class="sc-head">${mark(56,"#fff")}<div><div class="sc-t">${esc(S.site.title)}</div><div class="sc-s">${esc(S.site.tag)}</div></div><div class="sc-live">LIVE</div></div>
  ${hide?`<div class="sc-soon">Results coming soon</div>`:`<div class="sc-grid"><div class="sc-board"><h2>Leaderboard</h2>${ord.map(([t,p],i)=>`<div class="sc-row"><span class="sc-rank">${i+1}</span><span class="sc-name">${esc(tOf(S,t).name)}</span><div class="sc-track"><div style="width:${p/mx*100}%;background:${tOf(S,t).color}"></div></div><b>${p}</b></div>`).join("")||"<p>No teams yet</p>"}</div>
   <div class="sc-latest"><h2>Latest results</h2>${pubs.map(p=>`<div class="sc-res"><div class="sc-pn">${esc(p.n)} <small>${esc(catName(S,p.cat))}</small></div>${calcS(S,p).filter(r=>r.rank<=3).map(r=>{const c=cOf(S,r.cid);return c?`<div class="sc-w">${["🥇","🥈","🥉"][r.rank-1]} ${esc(c.name)} <small>${esc(tOf(S,c.team).name)}</small></div>`:""}).join("")}</div>`).join("")||"<p>Waiting for the first result…</p>"}</div></div>`}
  <div class="sc-foot">${mark(20,"rgba(255,255,255,.8)")} Powered by Mehfil</div></div>`}

/* ---------- QR codes ---------- */
function renderQRs(){document.querySelectorAll(".qrx[data-q]").forEach(el=>{if(el.dataset.done===el.dataset.q)return;el.innerHTML="";el.dataset.done=el.dataset.q;
  if(typeof QRCode==="undefined"){el.innerHTML=`<span class="qrfb">QR</span>`;return}
  const sz=el.classList.contains("big")?150:72;try{new QRCode(el,{text:el.dataset.q,width:sz,height:sz,colorDark:"#0F2340",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){el.innerHTML=`<span class="qrfb">QR</span>`}})}

/* ---------- motion ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let _tq=0,_tx=0,_ty=0;
document.addEventListener("pointermove",e=>{if(RM||e.pointerType!=="mouse")return;_tx=e.clientX;_ty=e.clientY;if(_tq)return;
  _tq=requestAnimationFrame(()=>{_tq=0;const sh=document.querySelector(".shot");if(!sh)return;const r=sh.getBoundingClientRect();
    const x=(_tx-(r.left+r.width/2))/r.width,y=(_ty-(r.top+r.height/2))/r.height;const near=Math.abs(x)<1.3&&Math.abs(y)<1.3;
    sh.style.setProperty("--ry",(near?x*9:0).toFixed(2)+"deg");sh.style.setProperty("--rx",(near?-y*7:0).toFixed(2)+"deg")})},{passive:true});
function countUp(){if(RM)return;document.querySelectorAll(".main.enter .stat b").forEach(el=>{const t=el.textContent.trim();if(!/^\d+$/.test(t))return;const n=+t;if(n<3)return;
  const st=performance.now();const step=ts=>{const k=Math.min(1,(ts-st)/750);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

/* ---------- boot ---------- */
(function boot(){let q;try{q=new URLSearchParams(location.search)}catch(e){q=new URLSearchParams("")}const f=q.get("f");
  if(f&&HAS_API){let code="";try{code=sessionStorage.getItem("mf_code_"+f)||""}catch(e){}PUBV={fest:f,tab:q.get("v")?"verify":"results",v:q.get("v")||"",code};VIEW=q.get("screen")?"screen":"public";
    if(VIEW==="screen")document.body.classList.add("screen-mode");paint();pubLoad();return}
  const lf=q.get("login");
  if(lf&&HAS_API){LFEST=lf;const s=store.get("mf_session");if(s&&s.token&&s.lfest===lf){TOKEN=s.token;ME=s.user;enter();return}
    VIEW="login";paint();api("festInfo",{fest:lf}).then(r=>{LFESTNAME=r.name;if(r.teamlock)UI.loginMsg="Team leader access is closed for now. Judges can still log in.";if(VIEW==="login")paint()}).catch(e=>{UI.loginMsg=e.message;if(VIEW==="login")paint()});return}
  const s=store.get("mf_session");if(s&&s.token&&HAS_API){TOKEN=s.token;ME=s.user;LFEST=s.lfest||"";enter();return}
  VIEW="landing";paint()})();
